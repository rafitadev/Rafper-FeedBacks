<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rafper Feedbacks</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #eaeaea;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 30px 0;
        }
        header h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #00d4ff, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        header p {
            color: #8892b0;
            margin-top: 10px;
        }
        .rom-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }
        .rom-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.1);
            color: #eaeaea;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .rom-btn:hover, .rom-btn.active {
            background: linear-gradient(90deg, #00d4ff, #0099cc);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.4);
        }
        .feedback-form {
            background: rgba(22, 33, 62, 0.8);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #00d4ff;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            color: #eaeaea;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }
        .rating {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 10px 0;
        }
        .rating input { display: none; }
        .rating label {
            cursor: pointer;
            font-size: 2rem;
            color: #444;
            transition: all 0.2s;
            user-select: none;
        }
        .rating label:hover {
            color: #ffd700;
            transform: scale(1.2);
        }
        .rating label.filled {
            color: #ffd700;
        }
        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #00d4ff, #0099cc);
            border: none;
            border-radius: 10px;
            color: #0f3460;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.5);
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .feedbacks-list {
            background: rgba(22, 33, 62, 0.8);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .feedbacks-list h2 {
            color: #00d4ff;
            margin-bottom: 20px;
            text-align: center;
        }
        .feedback-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #00d4ff;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .feedback-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .feedback-rom {
            background: linear-gradient(90deg, #00d4ff, #0099cc);
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #0f3460;
        }
        .feedback-date {
            color: #8892b0;
            font-size: 0.85rem;
        }
        .feedback-author {
            font-weight: 600;
            color: #ff6b6b;
            margin-bottom: 5px;
        }
        .feedback-rating {
            color: #ffd700;
            margin-bottom: 10px;
        }
        .feedback-text {
            color: #ccd6f6;
            line-height: 1.6;
        }
        .empty-state {
            text-align: center;
            color: #8892b0;
            padding: 40px;
        }
        .device-badge {
            display: inline-block;
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }
        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .status-connected {
            background: rgba(0, 212, 255, 0.2);
            color: #00d4ff;
        }
        .status-disconnected {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .status-dot.connected { background: #00d4ff; }
        .status-dot.disconnected { background: #ff6b6b; }
        .telegram-links {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .telegram-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            background: linear-gradient(135deg, #0088cc, #00a5e0);
            color: white;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.4);
        }
        .telegram-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 136, 204, 0.6);
            background: linear-gradient(135deg, #00a5e0, #0088cc);
        }
        .telegram-btn svg {
            flex-shrink: 0;
        }
        .checkbox-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            cursor: pointer;
            font-weight: normal;
            color: #8892b0;
            font-size: 0.9rem;
        }
        .checkbox-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #00d4ff;
            cursor: pointer;
        }
        .form-group input[disabled] {
            opacity: 0.5;
            background: rgba(255, 255, 255, 0.02);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Rafper Feedbacks</h1>
            <p>Feedback for Redmi Note 8 Custom ROMs</p>
            <span class="device-badge">Device: Redmi Note 8 / 8T (Ginkgo/Willow)</span>
            <div class="telegram-links">
                <a href="https://t.me/RafperTest" target="_blank" class="telegram-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.42 15.58l-3.75.74-1.53-3.37L9 15.27l-2.67-1.75 3.33-.42L12 9.09l1.74 3.65 3.33.42-2.67 1.75 1.11 3.24-3.76-.74z"/></svg>
                    <span>Channel</span>
                </a>
                <a href="https://t.me/Gsis8890" target="_blank" class="telegram-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.42 15.58l-3.75.74-1.53-3.37L9 15.27l-2.67-1.75 3.33-.42L12 9.09l1.74 3.65 3.33.42-2.67 1.75 1.11 3.24-3.76-.74z"/></svg>
                    <span>Support Chat</span>
                </a>
            </div>
        </header>

        <div id="statusIndicator" class="status-indicator status-disconnected" style="display:none;">
            <span class="status-dot disconnected"></span>
            <span id="statusText">Connecting...</span>
        </div>

        <div class="rom-selector">
            <button class="rom-btn active" data-rom="all">All ROMs</button>
            <button class="rom-btn" data-rom="HyperOS 1.0.2.0">HyperOS 1.0.2.0</button>
            <button class="rom-btn" data-rom="HyperOS 2.0.6.0">HyperOS 2.0.6.0</button>
            <button class="rom-btn" data-rom="HyperOS 2.0.8.0">HyperOS 2.0.8.0</button>
            <button class="rom-btn" data-rom="HyperOS 2.0.224">HyperOS 2.0.224</button>
        </div>

        <div class="feedback-form">
            <h2 style="color: #00d4ff; margin-bottom: 20px; text-align: center;">Submit Feedback</h2>
            <div class="form-group">
                <label for="author">Your Name / Nickname</label>
                <input type="text" id="author" placeholder="Ex: Rafael, User123..." maxlength="30">
                <label class="checkbox-label">
                    <input type="checkbox" id="anonymousCheck"> Post as Anonymous
                </label>
            </div>
            <div class="form-group">
                <label>Your Rating</label>
                <div class="rating" id="rating">
                    <input type="radio" name="rating" id="star1" value="1"><label for="star1" data-value="1">★</label>
                    <input type="radio" name="rating" id="star2" value="2"><label for="star2" data-value="2">★</label>
                    <input type="radio" name="rating" id="star3" value="3"><label for="star3" data-value="3">★</label>
                    <input type="radio" name="rating" id="star4" value="4"><label for="star4" data-value="4">★</label>
                    <input type="radio" name="rating" id="star5" value="5"><label for="star5" data-value="5">★</label>
                </div>
            </div>
            <div class="form-group">
                <label for="feedback">Your Feedback</label>
                <textarea id="feedback" rows="4" placeholder="Share your experience with the ROM: performance, bugs, battery, camera, etc..." required maxlength="1000"></textarea>
            </div>
            <button class="btn-submit" id="submitBtn">Submit Feedback</button>
        </div>

        <div class="feedbacks-list">
            <h2>Received Feedbacks</h2>
            <div id="feedbacksContainer">
                <div class="empty-state">Loading feedbacks...</div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
        import { getDatabase, ref, push, onValue, off, query, orderByChild, limitToLast } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyBtTYMupsu0w6yAYPANKxsaxvLBBVDOqdU",
            authDomain: "rafper-feedbacks.firebaseapp.com",
            databaseURL: "https://rafper-feedbacks-default-rtdb.firebaseio.com",
            projectId: "rafper-feedbacks",
            storageBucket: "rafper-feedbacks.firebasestorage.app",
            messagingSenderId: "254959542657",
            appId: "1:254959542657:web:553e0e3b8ba9843d794880"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const feedbacksRef = ref(db, 'feedbacks');

        const ROMS = [
            "HyperOS 1.0.2.0",
            "HyperOS 2.0.6.0",
            "HyperOS 2.0.8.0",
            "HyperOS 2.0.224"
        ];

        let selectedRom = "all";
        let currentRating = 0;
        let allFeedbacks = [];
        let unsubscribe = null;

        const romBtns = document.querySelectorAll('.rom-btn');
        const ratingStars = document.querySelectorAll('.rating input');
        const feedbackContainer = document.getElementById('feedbacksContainer');
        const submitBtn = document.getElementById('submitBtn');
        const statusIndicator = document.getElementById('statusIndicator');
        const statusText = document.getElementById('statusText');
        const statusDot = statusIndicator.querySelector('.status-dot');

        function setStatus(connected, message) {
            statusIndicator.style.display = 'inline-flex';
            if (connected) {
                statusIndicator.className = 'status-indicator status-connected';
                statusDot.className = 'status-dot connected';
            } else {
                statusIndicator.className = 'status-indicator status-disconnected';
                statusDot.className = 'status-dot disconnected';
            }
            statusText.textContent = message;
        }

        function renderFeedbacks() {
            const filtered = selectedRom === "all" 
                ? allFeedbacks 
                : allFeedbacks.filter(f => f.rom === selectedRom);
            const sorted = [...filtered].reverse();
            
            if (sorted.length === 0) {
                feedbackContainer.innerHTML = '<div class="empty-state">No feedback yet. Be the first to submit!</div>';
                return;
            }

            feedbackContainer.innerHTML = sorted.map(fb => `
                <div class="feedback-item">
                    <div class="feedback-header">
                        <span class="feedback-rom">${fb.rom}</span>
                        <span class="feedback-date">${new Date(fb.date).toLocaleString('en-US')}</span>
                    </div>
                    <div class="feedback-author">${fb.author}</div>
                    <div class="feedback-rating">${'★'.repeat(fb.rating)}${'☆'.repeat(5 - fb.rating)}</div>
                    <div class="feedback-text">${fb.text}</div>
                </div>
            `).join('');
        }

        function listenFeedbacks() {
            if (unsubscribe) off(feedbacksRef, 'value', unsubscribe);
            
            const q = query(feedbacksRef, orderByChild('date'), limitToLast(100));
            
            unsubscribe = onValue(q, (snapshot) => {
                setStatus(true, 'Connected - Live updates');
                const data = snapshot.val();
                allFeedbacks = [];
                if (data) {
                    Object.entries(data).forEach(([key, value]) => {
                        allFeedbacks.push({ id: key, ...value });
                    });
                }
                renderFeedbacks();
            }, (error) => {
                console.error('Firebase error:', error);
                setStatus(false, 'Connection error - Check config');
            });
        }

        romBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                romBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedRom = btn.dataset.rom;
                renderFeedbacks();
            });
        });

        const ratingLabels = document.querySelectorAll('.rating label');
        const anonymousCheck = document.getElementById('anonymousCheck');
        const authorInput = document.getElementById('author');

        // Anonymous checkbox handler
        anonymousCheck.addEventListener('change', () => {
            if (anonymousCheck.checked) {
                authorInput.disabled = true;
                authorInput.placeholder = 'Anonymous';
                authorInput.value = '';
            } else {
                authorInput.disabled = false;
                authorInput.placeholder = 'Ex: Rafael, User123...';
            }
        });

        ratingLabels.forEach(label => {
            label.addEventListener('click', () => {
                currentRating = parseInt(label.dataset.value);
                // Update visual state
                ratingLabels.forEach(l => {
                    const val = parseInt(l.dataset.value);
                    l.classList.toggle('filled', val <= currentRating);
                });
                // Also check the radio input
                document.getElementById('star' + currentRating).checked = true;
            });
            // Hover effect
            label.addEventListener('mouseenter', () => {
                const hoverVal = parseInt(label.dataset.value);
                ratingLabels.forEach(l => {
                    const val = parseInt(l.dataset.value);
                    l.classList.toggle('filled', val <= hoverVal);
                });
            });
        });

        document.getElementById('rating').addEventListener('mouseleave', () => {
            ratingLabels.forEach(l => {
                const val = parseInt(l.dataset.value);
                l.classList.toggle('filled', val <= currentRating);
            });
        });

        submitBtn.addEventListener('click', async () => {
            const isAnonymous = anonymousCheck.checked;
            const author = isAnonymous ? 'Anonymous' : document.getElementById('author').value.trim();
            const text = document.getElementById('feedback').value.trim();

            if (!isAnonymous && !author) {
                alert('Please enter your name or check "Post as Anonymous"');
                return;
            }
            if (!text || currentRating === 0) {
                alert('Please fill all fields and select a rating!');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';

            try {
                await push(feedbacksRef, {
                    rom: selectedRom === "all" ? "HyperOS 1.0.2.0" : selectedRom,
                    author,
                    rating: currentRating,
                    text,
                    date: new Date().toISOString()
                });

                document.getElementById('author').value = '';
                document.getElementById('feedback').value = '';
                ratingStars.forEach(s => s.checked = false);
                ratingLabels.forEach(l => l.classList.remove('filled'));
                anonymousCheck.checked = false;
                authorInput.disabled = false;
                authorInput.placeholder = 'Ex: Rafael, User123...';
                currentRating = 0;

                alert('Feedback submitted successfully!');
            } catch (error) {
                console.error('Error submitting:', error);
                alert('Failed to submit. Check connection.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Feedback';
            }
        });

        // Start listening
        listenFeedbacks();
    </script>
</body>
</html>
