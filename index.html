<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rafper Feedbacks</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-primary: #0d0d0d;
            --bg-secondary: #161616;
            --bg-tertiary: #1f1f1f;
            --bg-card: #1a1a1a;
            --border-color: #2a2a2a;
            --text-primary: #eaeaea;
            --text-secondary: #8892b0;
            --accent-primary: #00d4ff;
            --accent-secondary: #0099cc;
            --accent-warm: #ff6b6b;
            --star-empty: #333;
            --star-filled: #ffd700;
            --success: #4caf50;
            --success-hover: #43a047;
            --telegram: #0088cc;
            --telegram-hover: #00a5e0;
        }
        [data-theme="dark-blue"] {
            --bg-primary: #0a1628;
            --bg-secondary: #0f1f3a;
            --bg-tertiary: #142850;
            --bg-card: #0f1f3a;
            --border-color: #1e3a5f;
        }
        [data-theme="purple"] {
            --bg-primary: #1a0a28;
            --bg-secondary: #2a0f3a;
            --bg-tertiary: #3a1450;
            --bg-card: #2a0f3a;
            --border-color: #3e1e5f;
            --accent-primary: #bb86fc;
            --accent-secondary: #9c5cfc;
        }
        [data-theme="green"] {
            --bg-primary: #0a2816;
            --bg-secondary: #0f3a1f;
            --bg-tertiary: #145028;
            --bg-card: #0f3a1f;
            --border-color: #1e5f2a;
            --accent-primary: #00ff88;
            --accent-secondary: #00cc6a;
            --success: #00ff88;
            --success-hover: #00cc6a;
        }
        [data-theme="gray"] {
            --bg-primary: #111111;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #242424;
            --bg-card: #1a1a1a;
            --border-color: #333333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            color: var(--text-primary);
            transition: background 0.3s ease, color 0.3s ease;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 30px 0;
            position: relative;
        }
        header h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-warm));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        header p {
            color: var(--text-secondary);
            margin-top: 10px;
        }
        .device-badge {
            display: inline-block;
            background: rgba(255, 107, 107, 0.2);
            color: var(--accent-warm);
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }
        .telegram-links {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .telegram-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            background: linear-gradient(135deg, var(--telegram), var(--telegram-hover));
            color: white;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.4);
        }
        .telegram-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 136, 204, 0.6);
        }
        .telegram-btn svg { flex-shrink: 0; }

        /* Settings Button */
        .settings-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 100;
        }
        .settings-btn:hover {
            background: var(--accent-primary);
            color: var(--bg-primary);
            transform: rotate(90deg);
        }

        /* Settings Dropdown */
        .settings-dropdown {
            position: absolute;
            top: 70px;
            right: 20px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            min-width: 280px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            z-index: 99;
        }
        .settings-dropdown.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .settings-section {
            margin-bottom: 20px;
        }
        .settings-section:last-child { margin-bottom: 0; }
        .settings-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }
        .theme-options, .lang-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .theme-btn, .lang-btn {
            flex: 1;
            min-width: 60px;
            padding: 10px 12px;
            border: 2px solid var(--border-color);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .theme-btn:hover, .lang-btn:hover {
            border-color: var(--accent-primary);
        }
        .theme-btn.active, .lang-btn.active {
            border-color: var(--accent-primary);
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: var(--bg-primary);
        }
        .theme-btn span { display: block; font-size: 0.7rem; opacity: 0.7; }

        .rom-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }
        .rom-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            border: 1px solid var(--border-color);
        }
        .rom-btn:hover, .rom-btn.active {
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.4);
            color: var(--bg-primary);
        }
        .android-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 20px;
            height: 20px;
            padding: 0 6px;
            margin-left: 8px;
            background: linear-gradient(135deg, var(--success), var(--success-hover));
            color: white;
            border-radius: 10px;
            font-size: 0.65rem;
            font-weight: 700;
            line-height: 1;
            box-shadow: 0 2px 6px rgba(76, 175, 80, 0.4);
        }
        .rom-btn.active .android-badge,
        .rom-btn:hover .android-badge {
            background: linear-gradient(135deg, var(--success-hover), var(--success));
            box-shadow: 0 2px 8px rgba(76, 175, 80, 0.6);
        }

        .feedback-form {
            background: var(--bg-card);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--accent-primary);
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }
        input[disabled] {
            opacity: 0.5;
            background: var(--bg-secondary);
        }
        .rating {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 10px 0;
        }
        .rating input { display: none; }
        .rating label {
            cursor: pointer;
            font-size: 2rem;
            color: var(--star-empty);
            transition: all 0.2s;
            user-select: none;
        }
        .rating label:hover,
        .rating label.filled {
            color: var(--star-filled);
            transform: scale(1.2);
        }
        .checkbox-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            cursor: pointer;
            font-weight: normal;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .checkbox-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent-primary);
            cursor: pointer;
        }
        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            border-radius: 10px;
            color: var(--bg-primary);
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.5);
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .feedbacks-list {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid var(--border-color);
        }
        .feedbacks-list h2 {
            color: var(--accent-primary);
            margin-bottom: 20px;
            text-align: center;
        }
        .feedback-item {
            background: var(--bg-tertiary);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 15px;
            border-left: 4px solid var(--accent-primary);
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .feedback-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .feedback-rom {
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--bg-primary);
        }
        .feedback-date {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
        .feedback-author {
            font-weight: 600;
            color: var(--accent-warm);
            margin-bottom: 5px;
        }
        .feedback-rating {
            color: var(--star-filled);
            margin-bottom: 10px;
        }
        .feedback-text {
            color: var(--text-primary);
            line-height: 1.6;
        }
        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            padding: 40px;
        }
        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .status-connected {
            background: rgba(0, 212, 255, 0.2);
            color: var(--accent-primary);
        }
        .status-disconnected {
            background: rgba(255, 107, 107, 0.2);
            color: var(--accent-warm);
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .status-dot.connected { background: var(--accent-primary); }
        .status-dot.disconnected { background: var(--accent-warm); }
    </style>
</head>

    <div class="container">
        <header>
            <button class="settings-btn" id="settingsBtn" aria-label="Settings">

                your_feedback: "Ваш отзыв",
                submit: "Отправить отзыв",
                received_feedbacks: "Полученные отзывы",
                loading: "Загрузка отзывов...",
                connected: "Подключено - Обновления в реальном времени",
                error_connection: "Ошибка подключения - Проверьте настройки",
                empty_no_feedback: "Отзывов пока нет. Будьте первым!",
                empty_rom: "Отзывов для этой прошивки пока нет.",
                fill_fields: "Заполните все поля и выберите оценку!",
                fill_name_or_anon: "Введите имя или отметьте \"Отправить анонимно\"",
                success: "Отзыв успешно отправлен!",
                error_submit: "Не удалось отправить. Проверьте соединение."
            },
            it: {
                subtitle: "Feedback per Custom ROM Redmi Note 8",
                telegram_channel: "Canale",
                telegram_support: "Chat Supporto",
                all_roms: "Tutte le ROM",
                connecting: "Connessione...",
                submit_feedback: "Invia Feedback",
                your_name: "Il tuo Nome / Nickname",
                post_anonymous: "Pubblica come Anonimo",
                your_rating: "La tua Valutazione",
                your_feedback: "Il tuo Feedback",
                submit: "Invia Feedback",
                received_feedbacks: "Feedback Ricevuti",
                loading: "Caricamento feedback...",
                connected: "Connesso - Aggiornamenti in tempo reale",
                error_connection: "Errore connessione - Controlla config",
                empty_no_feedback: "Nessun feedback ancora. Sii il primo!",
                empty_rom: "Nessun feedback per questa ROM.",
                fill_fields: "Compila tutti i campi e seleziona una valutazione!",
                fill_name_or_anon: "Inserisci il nome o spunta \"Pubblica come Anonimo\"",
                success: "Feedback inviato con successo!",
                error_submit: "Invio fallito. Controlla la connessione."
            }
        };

        let currentLang = 'en';
        let currentTheme = 'default';
        let selectedRom = "all";
        let currentRating = 0;
        let allFeedbacks = [];
        let unsubscribe = null;

        const settingsBtn = document.getElementById('settingsBtn');
        const settingsDropdown = document.getElementById('settingsDropdown');
        const themeBtns = document.querySelectorAll('.theme-btn');
        const langBtns = document.querySelectorAll('.lang-btn');
        const romBtns = document.querySelectorAll('.rom-btn');
        const ratingLabels = document.querySelectorAll('.rating label');
        const feedbackContainer = document.getElementById('feedbacksContainer');
        const submitBtn = document.getElementById('submitBtn');
        const statusIndicator = document.getElementById('statusIndicator');
        const statusText = document.getElementById('statusText');
        const statusDot = statusIndicator.querySelector('.status-dot');
        const anonymousCheck = document.getElementById('anonymousCheck');
        const authorInput = document.getElementById('author');

        // Settings dropdown toggle
        settingsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            settingsDropdown.classList.toggle('open');
        });
        document.addEventListener('click', () => {
            settingsDropdown.classList.remove('open');
        });
        settingsDropdown.addEventListener('click', (e) => e.stopPropagation());

        // Theme switcher
        themeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                themeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTheme = btn.dataset.theme;
                document.documentElement.setAttribute('data-theme', currentTheme === 'default' ? '' : currentTheme);
                localStorage.setItem('rafper_theme', currentTheme);
            });
        });

        // Language switcher
        langBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                langBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentLang = btn.dataset.lang;
                applyLanguage(currentLang);
                localStorage.setItem('rafper_lang', currentLang);
            });
        });

        function applyLanguage(lang) {
            const t = translations[lang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                if (t[key]) {
                    if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                        el.placeholder = t[key];
                    } else {
                        el.textContent = t[key];
                    }
                }
            });
            document.documentElement.lang = lang;
            // Update dynamic texts
            if (statusIndicator.style.display !== 'none') {
                statusText.textContent = statusDot.classList.contains('connected') ? t.connected : t.connecting;
            }
            renderFeedbacks();
        }

        function setStatus(connected, messageKey) {
            statusIndicator.style.display = 'inline-flex';
            const t = translations[currentLang];
            if (connected) {
                statusIndicator.className = 'status-indicator status-connected';
                statusDot.className = 'status-dot connected';
                statusText.textContent = t[messageKey] || t.connected;
            } else {
                statusIndicator.className = 'status-indicator status-disconnected';
                statusDot.className = 'status-dot disconnected';
                statusText.textContent = t[messageKey] || t.error_connection;
            }
        }

        function renderFeedbacks() {
            const t = translations[currentLang];
            const filtered = selectedRom === "all" 
                ? allFeedbacks 
                : allFeedbacks.filter(f => f.rom === selectedRom);
            const sorted = [...filtered].reverse();
            
            if (sorted.length === 0) {
                feedbackContainer.innerHTML = `<div class="empty-state">${selectedRom === "all" ? t.empty_no_feedback : t.empty_rom}</div>`;
                return;
            }

            feedbackContainer.innerHTML = sorted.map(fb => `
                <div class="feedback-item">
                    <div class="feedback-header">
                        <span class="feedback-rom">${fb.rom}</span>
                        <span class="feedback-date">${new Date(fb.date).toLocaleString(currentLang === 'ru' ? 'ru-RU' : currentLang === 'es' ? 'es-ES' : currentLang === 'it' ? 'it-IT' : 'en-US')}</span>
                    </div>
                    <div class="feedback-author">${fb.author}</div>
                    <div class="feedback-rating">${'★'.repeat(fb.rating)}${'☆'.repeat(5 - fb.rating)}</div>
                    <div class="feedback-text">${fb.text}</div>
                </div>
            `).join('');
        }

        function listenFeedbacks() {
            if (unsubscribe) off(feedbacksRef, 'value', unsubscribe);
            
            const q = query(feedbacksRef, orderByChild('date'), limitToLast(100));
            
            unsubscribe = onValue(q, (snapshot) => {
                console.log('Firebase snapshot received:', snapshot.exists() ? Object.keys(snapshot.val()).length + ' items' : 'empty');
                setStatus(true, 'connected');
                const data = snapshot.val();
                allFeedbacks = [];
                if (data) {
                    Object.entries(data).forEach(([key, value]) => {
                        allFeedbacks.push({ id: key, ...value });
                    });
                }
                console.log('Total feedbacks loaded:', allFeedbacks.length);
                renderFeedbacks();
            }, (error) => {
                console.error('Firebase error:', error);
                setStatus(false, 'error_connection');
            });
        }

        romBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                romBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedRom = btn.dataset.rom;
                renderFeedbacks();
            });
        });

        ratingLabels.forEach(label => {
            label.addEventListener('click', () => {
                currentRating = parseInt(label.dataset.value);
                ratingLabels.forEach(l => {
                    const val = parseInt(l.dataset.value);
                    l.classList.toggle('filled', val <= currentRating);
                });
                document.getElementById('star' + currentRating).checked = true;
            });
            label.addEventListener('mouseenter', () => {
                const hoverVal = parseInt(label.dataset.value);
                ratingLabels.forEach(l => {
                    const val = parseInt(l.dataset.value);
                    l.classList.toggle('filled', val <= hoverVal);
                });
            });
        });

        document.getElementById('rating').addEventListener('mouseleave', () => {
            ratingLabels.forEach(l => {
                const val = parseInt(l.dataset.value);
                l.classList.toggle('filled', val <= currentRating);
            });
        });

        // Anonymous checkbox handler
        anonymousCheck.addEventListener('change', () => {
            if (anonymousCheck.checked) {
                authorInput.disabled = true;
                authorInput.placeholder = translations[currentLang].post_anonymous;
                authorInput.value = '';
            } else {
                authorInput.disabled = false;
                authorInput.placeholder = translations[currentLang].your_name.includes('Nickname') ? 'Ex: Rafael, User123...' : 'Ex: Rafael, User123...';
            }
        });

        submitBtn.addEventListener('click', async () => {
            const t = translations[currentLang];
            const isAnonymous = anonymousCheck.checked;
            const author = isAnonymous ? 'Anonymous' : document.getElementById('author').value.trim();
            const text = document.getElementById('feedback').value.trim();

            if (!isAnonymous && !author) {
                alert(t.fill_name_or_anon);
                return;
            }
            if (!text || currentRating === 0) {
                alert(t.fill_fields);
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = t.submitting || 'Submitting...';

            try {
                await push(feedbacksRef, {
                    rom: selectedRom === "all" ? "HyperOS 1.0.2.0" : selectedRom,
                    author,
                    rating: currentRating,
                    text,
                    date: new Date().toISOString()
                });

                document.getElementById('author').value = '';
                document.getElementById('feedback').value = '';
                document.querySelectorAll('.rating input').forEach(s => s.checked = false);
                ratingLabels.forEach(l => l.classList.remove('filled'));
                anonymousCheck.checked = false;
                authorInput.disabled = false;
                authorInput.placeholder = 'Ex: Rafael, User123...';
                currentRating = 0;

                alert(t.success);
            } catch (error) {
                console.error('Error submitting:', error);
                alert(t.error_submit);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = t.submit;
            }
        });

        // Load saved preferences
        const savedTheme = localStorage.getItem('rafper_theme');
        const savedLang = localStorage.getItem('rafper_lang');
        if (savedTheme) {
            currentTheme = savedTheme;
            document.documentElement.setAttribute('data-theme', currentTheme === 'default' ? '' : currentTheme);
            themeBtns.forEach(b => b.classList.toggle('active', b.dataset.theme === currentTheme));
        }
        if (savedLang) {
            currentLang = savedLang;
            langBtns.forEach(b => b.classList.toggle('active', b.dataset.lang === currentLang));
            applyLanguage(currentLang);
        } else {
            applyLanguage(currentLang);
        }

        // Start listening
        listenFeedbacks();
    </script>
</body>
</html>
