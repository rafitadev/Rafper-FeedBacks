<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rafper Feedbacks</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-primary: #0d0d0d;
            --bg-secondary: #161616;
            --bg-tertiary: #1f1f1f;
            --bg-card: #1a1a1a;
            --border-color: #2a2a2a;
            --text-primary: #eaeaea;
            --text-secondary: #8892b0;
            --accent-primary: #00d4ff;
            --accent-secondary: #0099cc;
            --accent-warm: #ff6b6b;
            --star-empty: #333;
            --star-filled: #ffd700;
            --success: #4caf50;
            --success-hover: #43a047;
            --telegram: #0088cc;
            --telegram-hover: #00a5e0;
        }
        [data-theme="dark-blue"] {
            --bg-primary: #0a1628;
            --bg-secondary: #0f1f3a;
            --bg-tertiary: #142850;
            --bg-card: #0f1f3a;
            --border-color: #1e3a5f;
        }
        [data-theme="purple"] {
            --bg-primary: #1a0a28;
            --bg-secondary: #2a0f3a;
            --bg-tertiary: #3a1450;
            --bg-card: #2a0f3a;
            --border-color: #3e1e5f;
            --accent-primary: #bb86fc;
            --accent-secondary: #9c5cfc;
        }
        [data-theme="green"] {
            --bg-primary: #0a2816;
            --bg-secondary: #0f3a1f;
            --bg-tertiary: #145028;
            --bg-card: #0f3a1f;
            --border-color: #1e5f2a;
            --accent-primary: #00ff88;
            --accent-secondary: #00cc6a;
            --success: #00ff88;
            --success-hover: #00cc6a;
        }
        [data-theme="gray"] {
            --bg-primary: #111111;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #242424;
            --bg-card: #1a1a1a;
            --border-color: #333333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            color: var(--text-primary);
            transition: background 0.3s ease, color 0.3s ease;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 30px 0;
            position: relative;
        }
        header h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-warm));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        header p {
            color: var(--text-secondary);
            margin-top: 10px;
        }
        .device-badge {
            display: inline-block;
            background: rgba(255, 107, 107, 0.2);
            color: var(--accent-warm);
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }
        .telegram-links {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .telegram-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            background: linear-gradient(135deg, var(--telegram), var(--telegram-hover));
            color: white;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.4);
        }
        .telegram-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 136, 204, 0.6);
        }
        .telegram-btn svg { flex-shrink: 0; }

        /* Settings Button */
        .settings-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 100;
        }
        .settings-btn:hover {
            background: var(--accent-primary);
            color: var(--bg-primary);
            transform: rotate(90deg);
        }

        /* Settings Dropdown */
        .settings-dropdown {
            position: absolute;
            top: 70px;
            right: 20px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            min-width: 280px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            z-index: 99;
        }
        .settings-dropdown.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .settings-section {
            margin-bottom: 20px;
        }
        .settings-section:last-child { margin-bottom: 0; }
        .settings-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }
        .theme-options, .lang-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .theme-btn, .lang-btn {
            flex: 1;
            min-width: 60px;
            padding: 10px 12px;
            border: 2px solid var(--border-color);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .theme-btn:hover, .lang-btn:hover {
            border-color: var(--accent-primary);
        }
        .theme-btn.active, .lang-btn.active {
            border-color: var(--accent-primary);
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: var(--bg-primary);
        }
        .theme-btn span { display: block; font-size: 0.7rem; opacity: 0.7; }

        .rom-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }
        .rom-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            border: 1px solid var(--border-color);
        }
        .rom-btn:hover, .rom-btn.active {
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.4);
            color: var(--bg-primary);
        }
        .android-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 20px;
            height: 20px;
            padding: 0 6px;
            margin-left: 8px;
            background: linear-gradient(135deg, var(--success), var(--success-hover));
            color: white;
            border-radius: 10px;
            font-size: 0.65rem;
            font-weight: 700;
            line-height: 1;
            box-shadow: 0 2px 6px rgba(76, 175, 80, 0.4);
        }
        .rom-btn.active .android-badge,
        .rom-btn:hover .android-badge {
            background: linear-gradient(135deg, var(--success-hover), var(--success));
            box-shadow: 0 2px 8px rgba(76, 175, 80, 0.6);
        }

        .feedback-form {
            background: var(--bg-card);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--accent-primary);
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }
        input[disabled] {
            opacity: 0.5;
            background: var(--bg-secondary);
        }
        .rating {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 10px 0;
        }
        .rating input { display: none; }
        .rating label {
            cursor: pointer;
            font-size: 2rem;
            color: var(--star-empty);
            transition: all 0.2s;
            user-select: none;
        }
        .rating label:hover,
        .rating label.filled {
            color: var(--star-filled);
            transform: scale(1.2);
        }
        .checkbox-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            cursor: pointer;
            font-weight: normal;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .checkbox-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent-primary);
            cursor: pointer;
        }
        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            border-radius: 10px;
            color: var(--bg-primary);
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.5);
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .feedbacks-list {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid var(--border-color);
        }
        .feedbacks-list h2 {
            color: var(--accent-primary);
            margin-bottom: 20px;
            text-align: center;
        }
        .feedback-item {
            background: var(--bg-tertiary);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 15px;
            border-left: 4px solid var(--accent-primary);
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .feedback-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .feedback-rom {
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--bg-primary);
        }
        .feedback-date {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
        .feedback-author {
            font-weight: 600;
            color: var(--accent-warm);
            margin-bottom: 5px;
        }
        .feedback-rating {
            color: var(--star-filled);
            margin-bottom: 10px;
        }
        .feedback-text {
            color: var(--text-primary);
            line-height: 1.6;
        }
        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            padding: 40px;
        }
        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .status-connected {
            background: rgba(0, 212, 255, 0.2);
            color: var(--accent-primary);
        }
        .status-disconnected {
            background: rgba(255, 107, 107, 0.2);
            color: var(--accent-warm);
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .status-dot.connected { background: var(--accent-primary); }
        .status-dot.disconnected { background: var(--accent-warm); }
        .site-footer {
            text-align: center;
            padding: 30px 20px 20px;
            margin-top: 20px;
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .site-footer a {
            color: var(--accent-primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }
        .site-footer a:hover {
            color: var(--accent-secondary);
            text-decoration: underline;
        }

        /* Auth Modal */
        .auth-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .auth-modal.open {
            opacity: 1;
            visibility: visible;
        }
        .auth-modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            margin: 20px;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }
        .auth-modal.open .auth-modal-content {
            transform: scale(1);
        }
        .auth-tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }
        .auth-tab {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .auth-tab.active {
            color: var(--accent-primary);
        }
        .auth-tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0; right: 0;
            height: 2px;
            background: var(--accent-primary);
        }
        .auth-form { display: none; }
        .auth-form.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .auth-form .form-group { margin-bottom: 16px; }
        .auth-form label { display: block; margin-bottom: 6px; font-size: 0.9rem; color: var(--text-secondary); }
        .auth-form input { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 10px; background: var(--bg-tertiary); color: var(--text-primary); font-size: 1rem; }
        .auth-form input:focus { outline: none; border-color: var(--accent-primary); }
        .auth-submit { width: 100%; padding: 14px; background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary)); border: none; border-radius: 10px; color: var(--bg-primary); font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .auth-close { position: absolute; top: 15px; right: 15px; background: none; border: none; color: var(--text-secondary); font-size: 1.5rem; cursor: pointer; }

        /* User Menu */
        .user-menu-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 100;
        }
        .user-menu-btn:hover { background: var(--accent-primary); color: var(--bg-primary); }
        .user-menu-btn.has-user { background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)); color: var(--bg-primary); }
        .user-dropdown {
            position: absolute;
            top: 70px;
            left: 20px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px;
            min-width: 220px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            z-index: 99;
        }
        .user-dropdown.open { opacity: 1; visibility: visible; transform: translateY(0); }
        .user-info { padding: 10px; border-bottom: 1px solid var(--border-color); margin-bottom: 8px; }
        .user-name { font-weight: 600; color: var(--text-primary); }
        .user-email { font-size: 0.8rem; color: var(--text-secondary); margin-top: 2px; }
        .user-anon { font-size: 0.8rem; color: var(--accent-warm); }
        .user-dropdown button { width: 100%; text-align: left; padding: 10px 12px; background: none; border: none; color: var(--text-primary); font-size: 0.9rem; cursor: pointer; border-radius: 8px; transition: background 0.2s; }
        .user-dropdown button:hover { background: var(--bg-tertiary); }
        .user-dropdown button.danger { color: var(--accent-warm); }

        /* Comments */
        .comments-section {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }
        .comments-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .comments-toggle { background: none; border: none; color: var(--accent-primary); cursor: pointer; font-size: 0.85rem; font-weight: 600; }
        .comments-list { max-height: 200px; overflow-y: auto; margin-bottom: 12px; }
        .comment-item { background: var(--bg-secondary); padding: 12px; border-radius: 10px; margin-bottom: 8px; animation: slideIn 0.3s ease; }
        .comment-header { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 0.8rem; }
        .comment-author { font-weight: 600; color: var(--accent-warm); }
        .comment-date { color: var(--text-secondary); }
        .comment-text { color: var(--text-primary); line-height: 1.5; font-size: 0.9rem; }
        .comment-form { display: flex; gap: 8px; }
        .comment-form textarea { flex: 1; min-height: 60px; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-tertiary); color: var(--text-primary); font-size: 0.9rem; resize: vertical; font-family: inherit; }
        .comment-form textarea:focus { outline: none; border-color: var(--accent-primary); }
        .comment-submit { padding: 10px 16px; background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary)); border: none; border-radius: 8px; color: var(--bg-primary); font-weight: 600; cursor: pointer; font-size: 0.85rem; white-space: nowrap; }
        .comment-submit:disabled { opacity: 0.5; cursor: not-allowed; }
        .login-prompt { text-align: center; padding: 16px; color: var(--text-secondary); font-size: 0.85rem; }
        .login-prompt button { background: none; border: none; color: var(--accent-primary); font-weight: 600; cursor: pointer; text-decoration: underline; }

    </style>
</head>
<body>
    <div class="container">
        <header>
            <button class="user-menu-btn" id="userMenuBtn" aria-label="User Menu">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
            </button>
            <div class="user-dropdown" id="userDropdown">
                <div class="user-info" id="userInfo">
                    <div class="user-name" id="userName">Guest</div>
                    <div class="user-email" id="userEmail">Not signed in</div>
                </div>
                <button id="openAuthModal" data-i18n="sign_in">Sign In / Sign Up</button>
                <button id="signOutBtn" class="danger" data-i18n="sign_out" style="display:none;">Sign Out</button>
            </div>
            <button class="settings-btn" id="settingsBtn" aria-label="Settings">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
            </button>
            <div class="settings-dropdown" id="settingsDropdown">
                <div class="settings-section">
                    <span class="settings-label">Theme</span>
                    <div class="theme-options">
                        <button class="theme-btn active" data-theme="default" title="Default Dark">
                            <span>Default</span>
                        </button>
                        <button class="theme-btn" data-theme="gray" title="Pure Gray/Black">
                            <span>Gray</span>
                        </button>
                        <button class="theme-btn" data-theme="dark-blue" title="Dark Blue">
                            <span>Blue</span>
                        </button>
                        <button class="theme-btn" data-theme="purple" title="Purple">
                            <span>Purple</span>
                        </button>
                        <button class="theme-btn" data-theme="green" title="Green">
                            <span>Green</span>
                        </button>
                    </div>
                </div>
                <div class="settings-section">
                    <span class="settings-label">Language</span>
                    <div class="lang-options">
                        <button class="lang-btn active" data-lang="en">English</button>

                loginForm.classList.toggle('active', target === 'login');
                signupForm.classList.toggle('active', target === 'signup');
            });

            e.preventDefault();
            const t = translations[currentLang];
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
                authModal.classList.remove('open');
                loginForm.reset();
            } catch (error) {
                alert(error.message);
            }
        });

        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const t = translations[currentLang];
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            try {
                const cred = await createUserWithEmailAndPassword(auth, email, password);
                await updateProfile(cred.user, { displayName: name });
                authModal.classList.remove('open');
                signupForm.reset();
            } catch (error) {
                alert(error.message);
            }

        signOutBtn.addEventListener('click', async () => {

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            updateUserUI(user);
        });

        function updateUserUI(user) {
            const t = translations[currentLang];
            if (user) {
                userMenuBtn.classList.add('has-user');
                userName.textContent = user.displayName || user.email?.split('@')[0] || 'User';
                userEmail.textContent = user.isAnonymous ? t.anonymous_user : user.email;
                userEmail.classList.toggle('user-anon', user.isAnonymous);
                openAuthModalBtn.style.display = 'none';
                signOutBtn.style.display = 'block';
            } else {
                userMenuBtn.classList.remove('has-user');
                userName.textContent = 'Guest';
                userEmail.textContent = t.not_signed_in || 'Not signed in';
                userEmail.classList.remove('user-anon');

        function applyLanguage(lang) {
            const t = translations[lang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                if (t[key]) {
                    if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                        el.placeholder = t[key];
                    } else {
                        el.textContent = t[key];
                    }
                }
            });
            document.documentElement.lang = lang;
            if (statusIndicator.style.display !== 'none') {
                statusText.textContent = statusDot.classList.contains('connected') ? t.connected : t.connecting;
            }
            updateUserUI(currentUser);
            renderFeedbacks();
        }

        function setStatus(connected, messageKey) {
            statusIndicator.style.display = 'inline-flex';
            const t = translations[currentLang];
            if (connected) {
                statusIndicator.className = 'status-indicator status-connected';
                statusDot.className = 'status-dot connected';
                statusText.textContent = t[messageKey] || t.connected;
            } else {
                statusIndicator.className = 'status-indicator status-disconnected';
                statusDot.className = 'status-dot disconnected';
                statusText.textContent = t[messageKey] || t.error_connection;
            }
        }

        function renderFeedbacks() {
            const t = translations[currentLang];
            const filtered = selectedRom === "all" 
                ? allFeedbacks 
                : allFeedbacks.filter(f => f.rom === selectedRom);
            const sorted = [...filtered].reverse();
            
            if (sorted.length === 0) {
                feedbackContainer.innerHTML = `<div class="empty-state">${selectedRom === "all" ? t.empty_no_feedback : t.empty_rom}</div>`;
                return;
            }

            feedbackContainer.innerHTML = sorted.map(fb => `
                <div class="feedback-item" data-feedback-id="${fb.id}">
                    <div class="feedback-header">
                        <span class="feedback-rom">${fb.rom}</span>
                        <span class="feedback-date">${new Date(fb.date).toLocaleString(currentLang === 'ru' ? 'ru-RU' : currentLang === 'es' ? 'es-ES' : currentLang === 'it' ? 'it-IT' : 'en-US')}</span>
                    </div>
                    <div class="feedback-author">${fb.author}</div>
                    <div class="feedback-rating">${'★'.repeat(fb.rating)}${'☆'.repeat(5 - fb.rating)}</div>
                    <div class="feedback-text">${fb.text}</div>
                    <div class="comments-section" id="comments-${fb.id}">
                        <div class="comments-header">
                            <span data-i18n="comments">${t.comments}</span>
                            <button class="comments-toggle" data-feedback-id="${fb.id}" data-i18n="show_comments">${t.show_comments || 'Show comments'}</button>
                        </div>
                        <div class="comments-list" id="comments-list-${fb.id}" style="display:none;"></div>
                        <div class="comment-area" id="comment-area-${fb.id}" style="display:none;">
                            ${currentUser ? `

                                    <textarea placeholder="${t.write_comment}" maxlength="500" required></textarea>

                                    <button type="button" class="open-auth-from-comment" data-i18n="sign_in">${t.sign_in}</button>
                                </div>
                            `}
                        </div>
                    </div>
                </div>
            `).join('');

            // Attach comment event listeners
            attachCommentListeners();
        }

        function attachCommentListeners() {
            const t = translations[currentLang];
            
            // Toggle comments
            document.querySelectorAll('.comments-toggle').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const feedbackId = e.target.dataset.feedbackId;
                    const list = document.getElementById(`comments-list-${feedbackId}`);
                    const area = document.getElementById(`comment-area-${feedbackId}`);
                    const isHidden = list.style.display === 'none';
                    list.style.display = isHidden ? 'block' : 'none';
                    area.style.display = isHidden ? 'block' : 'none';
                    e.target.textContent = isHidden ? (t.hide_comments || 'Hide comments') : t.show_comments;
                    if (isHidden) loadComments(feedbackId);
                });

                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const feedbackId = form.dataset.feedbackId;
                    const textarea = form.querySelector('textarea');
                    const text = textarea.value.trim();
                    if (!text || !currentUser) return;

                    const submitBtn = form.querySelector('.comment-submit');
                    submitBtn.disabled = true;
                    
                    try {
                        const commentsRef = ref(db, `feedbacks/${feedbackId}/comments`);
                        await push(commentsRef, {
                            author: currentUser.displayName || currentUser.email?.split('@')[0] || 'User',
                            authorId: currentUser.uid,
                            text,
                            date: serverTimestamp()
                        });
                        textarea.value = '';
                    } catch (error) {
                        console.error('Comment error:', error);
                        alert(t.error_submit);
                    } finally {
                        submitBtn.disabled = false;
                    }
                });
            });

            // Open auth from comment prompt
            document.querySelectorAll('.open-auth-from-comment').forEach(btn => {
                btn.addEventListener('click', () => {
                    authModal.classList.add('open');
                });
            });
        }

        function loadComments(feedbackId) {
            if (commentsUnsubscribes[feedbackId]) {
                off(ref(db, `feedbacks/${feedbackId}/comments`), 'value', commentsUnsubscribes[feedbackId]);
            }
            
            const commentsRef = ref(db, `feedbacks/${feedbackId}/comments`);
            const q = query(commentsRef, orderByChild('date'), limitToLast(50));
            
            const t = translations[currentLang];
            const listEl = document.getElementById(`comments-list-${feedbackId}`);
            
            commentsUnsubscribes[feedbackId] = onValue(q, (snapshot) => {
                listEl.innerHTML = '';
                const data = snapshot.val();
                if (!data) {
                    listEl.innerHTML = `<div class="empty-state" style="padding:16px;font-size:0.85rem;">${t.no_comments}</div>`;
                    return;
                }
                
                const comments = Object.entries(data)
                    .map(([key, value]) => ({ id: key, ...value }))
                    .sort((a, b) => new Date(a.date) - new Date(b.date));
                
                listEl.innerHTML = comments.map(c => `
                    <div class="comment-item">
                        <div class="comment-header">
                            <span class="comment-author">${c.author}</span>
                            <span class="comment-date">${c.date ? new Date(c.date).toLocaleString(currentLang === 'ru' ? 'ru-RU' : currentLang === 'es' ? 'es-ES' : currentLang === 'it' ? 'it-IT' : 'en-US') : ''}</span>
                        </div>
                        <div class="comment-text">${c.text}</div>
                    </div>
                `).join('');
            });
        }

        function listenFeedbacks() {
            if (unsubscribe) off(feedbacksRef, 'value', unsubscribe);
            
            const q = query(feedbacksRef, orderByChild('date'), limitToLast(100));
            
            unsubscribe = onValue(q, (snapshot) => {
                console.log('Firebase snapshot received:', snapshot.exists() ? Object.keys(snapshot.val()).length + ' items' : 'empty');
                setStatus(true, 'connected');
                const data = snapshot.val();
                allFeedbacks = [];
                if (data) {
                    Object.entries(data).forEach(([key, value]) => {
                        allFeedbacks.push({ id: key, ...value });
                    });
                }
                console.log('Total feedbacks loaded:', allFeedbacks.length);
                renderFeedbacks();
            }, (error) => {
                console.error('Firebase error:', error);
                setStatus(false, 'error_connection');
            });
        }

        romBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                romBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedRom = btn.dataset.rom;
                renderFeedbacks();
            });
        });

        ratingLabels.forEach(label => {
            label.addEventListener('click', () => {
                currentRating = parseInt(label.dataset.value);
                ratingLabels.forEach(l => {
                    const val = parseInt(l.dataset.value);
                    l.classList.toggle('filled', val <= currentRating);
                });
                document.getElementById('star' + currentRating).checked = true;
            });
            label.addEventListener('mouseenter', () => {
                const hoverVal = parseInt(label.dataset.value);
                ratingLabels.forEach(l => {
                    const val = parseInt(l.dataset.value);
                    l.classList.toggle('filled', val <= hoverVal);
                });
            });
        });

        document.getElementById('rating').addEventListener('mouseleave', () => {
            ratingLabels.forEach(l => {
                const val = parseInt(l.dataset.value);
                l.classList.toggle('filled', val <= currentRating);
            });
        });

        // Anonymous checkbox handler
        anonymousCheck.addEventListener('change', () => {
            if (anonymousCheck.checked) {
                authorInput.disabled = true;
                authorInput.placeholder = translations[currentLang].post_anonymous;
                authorInput.value = '';
            } else {
                authorInput.disabled = false;
                authorInput.placeholder = 'Ex: Rafael, User123...';
            }
        });

        submitBtn.addEventListener('click', async () => {
            const t = translations[currentLang];
            const isAnonymous = anonymousCheck.checked;
            const author = isAnonymous ? 'Anonymous' : document.getElementById('author').value.trim();
            const text = document.getElementById('feedback').value.trim();

            if (!isAnonymous && !author) {
                alert(t.fill_name_or_anon);
                return;
            }
            if (!text || currentRating === 0) {
                alert(t.fill_fields);
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = t.submitting || 'Submitting...';

            try {
                await push(feedbacksRef, {
                    rom: selectedRom === "all" ? "HyperOS 1.0.2.0" : selectedRom,
                    author,
                    rating: currentRating,
                    text,
                    date: new Date().toISOString()
                });

                document.getElementById('author').value = '';
                document.getElementById('feedback').value = '';
                document.querySelectorAll('.rating input').forEach(s => s.checked = false);
                ratingLabels.forEach(l => l.classList.remove('filled'));
                anonymousCheck.checked = false;
                authorInput.disabled = false;
                authorInput.placeholder = 'Ex: Rafael, User123...';
                currentRating = 0;

                alert(t.success);
            } catch (error) {
                console.error('Error submitting:', error);
                alert(t.error_submit);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = t.submit;
            }
        });

        // Load saved preferences
        const savedTheme = localStorage.getItem('rafper_theme');
        const savedLang = localStorage.getItem('rafper_lang');
        if (savedTheme) {
            currentTheme = savedTheme;
            document.documentElement.setAttribute('data-theme', currentTheme === 'default' ? '' : currentTheme);
            themeBtns.forEach(b => b.classList.toggle('active', b.dataset.theme === currentTheme));
        }
        if (savedLang) {
            currentLang = savedLang;
            langBtns.forEach(b => b.classList.toggle('active', b.dataset.lang === currentLang));
            applyLanguage(currentLang);
        } else {
            applyLanguage(currentLang);
        }

        // Start listening
        listenFeedbacks();
    </script>
</body>
</html>
