<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>Rafper Feedbacks</title>
<meta name="description" content="Feedback for Redmi Note 8 Custom ROMs">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📱</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body data-view="home" data-scrolled="0" data-nav="none">

<header class="top" id="top">
  <div class="shell top__in">
    <span class="top__title notranslate" id="top-title" translate="no">Rafper Feedbacks</span>
    <a class="top__act" id="settings-link" href="#settings" aria-label="Settings" data-icon="settings"></a>
  </div>
</header>

<main class="shell" id="app">
  <div class="loading">
    <span class="spin spin--lg" role="status" aria-label="Loading feedbacks">
      <svg viewBox="0 0 14 14">
        <circle class="spin__ring" cx="7" cy="7" r="6.3" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <circle class="spin__dot" cx="4.2" cy="7" r="1.4" fill="currentColor"/>
      </svg>
    </span>
    <span data-i18n="loading_feedbacks">Loading feedbacks</span>
  </div>
  <noscript><div class="empty"><h3>JavaScript is off</h3><p>The feedback list needs it to render.</p></div></noscript>
</main>

<footer class="foot shell">
  <span>Rafper Project Is A Project Created By <a href="https://github.com/rafitadev" target="_blank">@RafitaDev</a> With ❤️</span>
  <span>|</span>
  <a href="https://t.me/RafperTest" target="_blank">Telegram</a>
  <span>|</span>
  <a href="https://t.me/Gsis8890" target="_blank">Support</a>
</footer>

<div class="lb" id="lb" data-open="0" data-closing="0" role="dialog" aria-modal="true" aria-label="Feedback details">
  <div class="lb__track" id="lb-track"></div>
  <button class="lb__close press" id="lb-close" type="button" aria-label="Close">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button>
  <div class="lb__count" id="lb-count"></div>
</div>

<div class="alert" id="alert" data-open="0" data-closing="0" role="alertdialog" aria-modal="true"
     aria-labelledby="alert-title" aria-describedby="alert-msg">
  <div class="alert__bg"></div>
  <div class="alert__box">
    <div class="alert__body">
      <h3 id="alert-title"></h3>
      <p id="alert-msg"></p>
      <span class="alert__host" id="alert-host"></span>
    </div>
    <div class="alert__acts">
      <button type="button" id="alert-cancel">Cancel</button>
      <button type="button" id="alert-go" class="alert__pri">Continue</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" data-show="0" role="status" aria-live="polite"></div>

<!-- Settings Modal -->
<div class="settings-modal" id="settingsModal" data-open="0">
  <div class="settings-modal__bg"></div>
  <div class="settings-modal__box">
    <div class="settings-modal__header">
      <h2 data-i18n="settings">Settings</h2>
      <button class="settings-modal__close" id="closeSettings" aria-label="Close">
        <svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="settings-modal__body">
      <div class="settings-section">
        <span class="settings-label" data-i18n="theme">Theme</span>
        <div class="seg" id="themeSeg" data-ready="1">
          <div class="seg__thumb"></div>
          <button class="seg__it active" data-theme="alpha-style" aria-selected="true">Alpha Style</button>
          <button class="seg__it" data-theme="alpha-glass" aria-selected="false">Alpha Glass</button>
          <button class="seg__it" data-theme="default" aria-selected="false">Default</button>
          <button class="seg__it" data-theme="gray" aria-selected="false">Gray</button>
        </div>
      </div>
      <div class="settings-section">
        <span class="settings-label" data-i18n="language">Language</span>
        <div class="seg" id="langSeg" data-ready="1">
          <div class="seg__thumb"></div>
          <button class="seg__it active" data-lang="en" aria-selected="true">English</button>
          <button class="seg__it" data-lang="es" aria-selected="false">Español</button>
          <button class="seg__it" data-lang="ru" aria-selected="false">Русский</button>
          <button class="seg__it" data-lang="it" aria-selected="false">Italiano</button>
        </div>
      </div>
      <div class="settings-section">
        <span class="settings-label" data-i18n="account">Account</span>
        <div id="accountStatus" class="account-status" data-i18n="not_signed_in">Not signed in</div>
        <button class="btn btn--block" id="openAuthFromSettings" data-i18n="sign_in">Sign In</button>
        <button class="btn btn--block" id="signOutBtn" style="display:none" data-i18n="sign_out">Sign Out</button>
      </div>
    </div>
  </div>
</div>

<!-- Auth Modal -->
<div class="auth-modal" id="authModal" data-open="0">
  <div class="auth-modal__bg"></div>
  <div class="auth-modal__box">
    <button class="auth-modal__close" id="closeAuthModal" aria-label="Close">
      <svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login" data-i18n="sign_in">Sign In</button>
      <button class="auth-tab" data-tab="signup" data-i18n="sign_up">Sign Up</button>
    </div>
    <form class="auth-form active" id="loginForm">
      <div class="form-group">
        <label data-i18n="email">Email</label>
        <input type="email" id="loginEmail" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label data-i18n="password">Password</label>
        <input type="password" id="loginPassword" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn--primary btn--block" data-i18n="sign_in">Sign In</button>
    </form>
    <div class="auth-divider">
      <span data-i18n="or_continue">Or continue as</span>
    </div>
    <button type="button" class="btn btn--block guest-btn" id="guestSignIn" data-i18n="continue_guest">Continue as Guest</button>
    <form class="auth-form" id="signupForm">
      <div class="form-group">
        <label data-i18n="display_name">Display Name</label>
        <input type="text" id="signupName" required placeholder="Your Name" maxlength="30">
      </div>
      <div class="form-group">
        <label data-i18n="email">Email</label>
        <input type="email" id="signupEmail" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label data-i18n="password">Password</label>
        <input type="password" id="signupPassword" required minlength="6" placeholder="Min 6 characters">
      </div>
      <button type="submit" class="btn btn--primary btn--block" data-i18n="create_account">Create Account</button>
    </form>
  </div>
</div>

<script type="module" src="assets/js/app.js"></script>
</body>
</html>
